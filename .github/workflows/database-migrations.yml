name: データベースの機能を更新
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4
      - name: SQLを検証
        run: npm ci && npm test
      - name: データベースの機能を更新
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs
